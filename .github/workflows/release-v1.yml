name: build-and-publish-v1

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/release-v1.yml', 'desktop/**', 'release-tools.cjs', 'SOURCE-v1.0.2.json', 'RELEASE-v1.0.2.md']
  push:
    branches: [main]
    paths: ['.github/workflows/release-v1.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-v1.0.2-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_VERSION: '1.0.2'
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.channel }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows, channel: modern, os: windows-2025, script: 'dist:win'}
          - {platform: windows, channel: legacy, os: windows-2025, script: 'dist:win:legacy'}
          - {platform: macos, channel: modern, os: macos-15, script: 'dist:mac'}
          - {platform: macos, channel: mojave, os: macos-15, script: 'dist:mac:mojave'}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep exact source bytes on every OS
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify exact head and validated product source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node --check release-tools.cjs
          node release-tools.cjs source
      - name: Install packaging dependencies
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm install --no-audit --no-fund
      - name: Build actual native package
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run '${{ matrix.script }}'
      - name: Verify actual OS metadata
        working-directory: desktop
        run: node verify-package.cjs '${{ matrix.platform }}' '${{ matrix.channel }}'
      - name: Normalize filename without changing installer bytes
        run: node release-tools.cjs normalize '${{ matrix.platform }}' '${{ matrix.channel }}'
      - uses: actions/upload-artifact@v4
        with:
          name: public-${{ matrix.platform }}-${{ matrix.channel }}-1.0.2
          path: desktop/release/*
          if-no-files-found: error
          compression-level: 0

  web:
    name: Read-only production brand smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Probe anonymous production surfaces only
        run: |
          for attempt in $(seq 1 12); do
            if node release-tools.cjs web; then exit 0; fi
            sleep 10
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: production-brand-smoke-1.0.2
          path: web-evidence/public-brand-smoke.json
          if-no-files-found: error

  release:
    name: Publish verified v1.0.2 without replacing old assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: public-*-*-1.0.2
          merge-multiple: true
          path: release
      - name: Verify all four same-head packages and hashes
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node release-tools.cjs payload
          (cd release && sha256sum -c SHA256SUMS.txt)
      - name: Stage a new release only
        run: |
          set -euo pipefail
          tag="v${APP_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Existing release must never be overwritten; inspect it before retrying.'
            exit 1
          fi
          cp RELEASE-v1.0.2.md RELEASE_NOTES.md
          printf '\nPublic packaging commit: `%s`\n' "$GITHUB_SHA" >> RELEASE_NOTES.md
          gh release create "$tag" release/* --draft --target "$GITHUB_SHA" --title "실용음악위원회 v${APP_VERSION}" --notes-file RELEASE_NOTES.md
      - name: Read back every staged asset before publication
        run: |
          set -euo pipefail
          gh release download "v${APP_VERSION}" --dir staged-readback
          test "$(find staged-readback -maxdepth 1 -type f | wc -l)" = "10"
          for file in release/*; do cmp "$file" "staged-readback/$(basename "$file")"; done
          (cd staged-readback && sha256sum -c SHA256SUMS.txt)
      - name: Publish the verified new release
        run: gh release edit "v${APP_VERSION}" --draft=false --latest
      - name: Anonymous public download readback
        env:
          GH_TOKEN: ''
        run: |
          set -euo pipefail
          mkdir public-readback
          base="https://github.com/${GH_REPO}/releases/download/v${APP_VERSION}"
          for file in release/*; do
            name="$(basename "$file")"
            curl --fail --location --retry 5 --retry-all-errors --max-time 180 "$base/$name" -o "public-readback/$name"
            cmp "$file" "public-readback/$name"
          done
          (cd public-readback && sha256sum -c SHA256SUMS.txt)
